# Сборка: docker compose run --rm build
# Бинарник появится рядом: ./haproxy
services:
  build:
    build:
      context: .
      target: export
      network: host
    platform: linux/amd64
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/out

# Сборка без кеша:
# docker compose build --no-cache && docker compose run --rm build
